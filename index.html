<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in with Google and save your profile securely.">
    <title>Google Profile Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="page-shell">
        <section class="auth-card" aria-labelledby="page-title">
            <div class="brand-mark" aria-hidden="true">G</div>
            <p class="eyebrow">Welcome back</p>
            <h1 id="page-title">Create your profile</h1>
            <p class="intro">Sign in with Google, then save your details securely to Firebase.</p>

            <button class="google-button" id="googleSignIn" type="button">
                <span class="google-icon" aria-hidden="true">G</span>
                <span>Continue with Google</span>
            </button>

            <div class="divider"><span>or enter details manually</span></div>

            <form id="profileForm" novalidate>
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" placeholder="Enter Your Name" autocomplete="name" required>
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                <button class="save-button" id="saveProfile" type="submit">Save profile</button>
            </form>

            <p class="status" id="status" role="status" aria-live="polite"></p>
            <div class="signed-in-user" id="signedInUser" hidden>
                <span class="avatar" id="avatar">G</span>
                <span id="userLabel"></span>
            </div>
        </section>
        <p class="privacy-note">Your profile is saved to your private Firebase record.</p>
    </main>


    <!-- Firebase v8 scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</body>
</html>
